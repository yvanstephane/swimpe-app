name: keepalive-app
# Garde l'app Streamlit "reveillee" avec un VRAI navigateur (pas un simple curl,
# que Streamlit ne compte pas comme une visite). Toutes les ~3 h : ouvre l'app,
# et si elle dort, clique "Yes, get this app back up!". Repo public = gratuit.
on:
  schedule:
    - cron: "23 */3 * * *"   # toutes les ~3 heures (fiable ; seuil de veille ~12 h)
  workflow_dispatch:          # bouton "Run workflow" manuel
jobs:
  reveiller:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer le navigateur (Playwright)
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Ouvrir l'app comme un vrai visiteur (et la reveiller si besoin)
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          URL = "https://swimpe-app-gxjuhhnhuhbbfcrwfr6wvg.streamlit.app/"
          with sync_playwright() as p:
              nav = p.chromium.launch()
              page = nav.new_page()
              page.goto(URL, wait_until="load", timeout=90000)
              # Si l'app dort, un bouton "Yes, get this app back up!" apparait.
              try:
                  bouton = page.get_by_text("get this app back up", exact=False)
                  if bouton.count() > 0:
                      print("App endormie -> clic sur le reveil")
                      bouton.first.click()
                  else:
                      print("App deja reveillee")
              except Exception as e:
                  print("Pas de bouton de reveil (app active) :", e)
              # Laisse le temps a la vraie session de s'etablir (compte comme visite)
              page.wait_for_timeout(45000)
              print("Visite terminee :", page.title())
              nav.close()
          PY
