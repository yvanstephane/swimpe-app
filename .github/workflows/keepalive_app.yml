name: keepalive-app
# Garde l'app Streamlit "reveillee" : un ping regulier empeche la mise en veille
# (et donc le long temps de reveil au premier visiteur). Repo public = Actions gratuit.
on:
  schedule:
    - cron: "*/12 * * * *"   # toutes les ~12 minutes
  workflow_dispatch:          # bouton "Run workflow" manuel
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app Streamlit
        run: |
          APP="https://swimpe-app-gxjuhhnhuhbbfcrwfr6wvg.streamlit.app"
          echo "Ping $APP"
          curl -s -o /dev/null -w "page   -> %{http_code}\n" "$APP/" || true
          curl -s -o /dev/null -w "health -> %{http_code}\n" "$APP/_stcore/health" || true
